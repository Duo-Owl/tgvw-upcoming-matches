
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGVW Upcoming Matches</title>

<style>
    body {
        margin: 0;
        width: 254px;
        background: transparent;
        font-family: Arial, sans-serif;
    }

    #matches {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    #matches a {
        color: #ffda70;
        text-decoration: none;
        font-size: 15px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
        font-weight: 700;
        transition: color 0.2s ease;
        margin-bottom: 10px;
    }

    #matches a:hover {
        filter: brightness(125%);
    }

    #status {
        font-size: 14px;
        opacity: 0.7;
    }
</style>
</head>

<body>

<div id="matches">
    <span id="status">Loading upcoming matches...</span>
</div>

<script>
const API = "https://api.chess.com/pub/club/the-great-viking-warriors/matches";

async function loadMatches() {
    const container = document.getElementById("matches");

    try {
        const response = await fetch(API);
        if (!response.ok) throw new Error("API request failed");

        const data = await response.json();

        const matches = data.registered || [];

        container.replaceChildren();

        if (!matches.length) {
            container.textContent = "No upcoming matches.";
            return;
        }

        matches.forEach(match => {
            const link = document.createElement("a");
            link.href = match["@id"]
                .replace("api.chess.com/pub", "www.chess.com/club");
            link.textContent = match.name;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            container.appendChild(link);
        });

    } catch (error) {
        container.textContent = "Unable to load matches.";
        console.error(error);
    }
}

loadMatches();
setInterval(loadMatches, 5 * 60 * 1000);
</script>

</body>
</html>
